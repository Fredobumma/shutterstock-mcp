[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shutterstock-mcp"
version = "0.1.1"
description = "An MCP server for Shutterstock: search photos, footage, music and editorial images, look at previews, find similar images, manage collections, and license with your own subscription."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manfred Obumma", email = "fredobumma@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "shutterstock", "stock-photos", "stock-footage", "claude"]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/fredobumma/shutterstock-mcp"
Issues = "https://github.com/fredobumma/shutterstock-mcp/issues"

[project.scripts]
shutterstock-mcp = "shutterstock_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9", "anyio>=4", "ruff>=0.17", "mypy>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/shutterstock_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
